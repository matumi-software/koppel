<!-- @dsCard group="Navigation" height=110 subtitle="Role switch and a view filter" -->
<div class="kp-root" style="padding: 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center;">
  <div class="kp-segment" role="radiogroup" aria-label="Role">
    <button class="kp-segment__item" role="radio" aria-checked="true">Server</button>
    <button class="kp-segment__item" role="radio" aria-checked="false">Client</button>
  </div>
  <div class="kp-segment" role="radiogroup" aria-label="Show">
    <button class="kp-segment__item" role="radio" aria-checked="false">All</button>
    <button class="kp-segment__item" role="radio" aria-checked="true">Shared</button>
    <button class="kp-segment__item" role="radio" aria-checked="false">Attached</button>
  </div>
</div>
<script>
  document.querySelectorAll('.kp-segment').forEach(function (group) {
    group.addEventListener('click', function (e) {
      var item = e.target.closest('.kp-segment__item');
      if (!item) return;
      group.querySelectorAll('.kp-segment__item').forEach(function (i) { i.setAttribute('aria-checked', String(i === item)); });
    });
  });
</script>
