# Koppel as a client on a Windows host with Docker Desktop. See docs/windows.md.
#   docker compose -f docker-compose.windows-client.yml up -d
# Then browse http://localhost:5240/
#
# A container cannot give a USB device to Windows. usbip-win2 on the host can: it attaches from the
# gateway below, and Koppel carries the session to the server over TLS behind a token.
#   usbip attach -r 127.0.0.1 -b <bus id>

name: koppel

services:
  koppel:
    image: matumi/koppel:latest
    hostname: ${KOPPEL_HOSTNAME:-${COMPUTERNAME:-koppel}}
    environment:
      # Plain USB/IP with no login. Published on the host's 127.0.0.1 only, so only this machine reaches it.
      Gateway__Port: "3242"
      Gateway__Address: 0.0.0.0
    ports:
      - "5240:5240"             # UI
      - "127.0.0.1:3240:3242"   # USB/IP gateway for usbip-win2
    volumes:
      - koppel:/koppel
    user: "0"
    restart: unless-stopped

volumes:
  koppel:
