# A repository that sits idle still gets new advisories. This runs the advisory checks every week, on main, and
# a failed run emails the people who watch the repository's Actions. It also says when Skakel has a newer tag
# than the one src/Cargo.toml pins, since nothing else notices (Dependabot is off, see docs/decisions.md).
name: Advisories

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src/Cargo.toml
          command: check advisories

  ui:
    name: UI advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: src/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: src/ui/.nvmrc
      - name: pnpm audit
        working-directory: src/ui
        run: pnpm audit --prod

  skakel:
    name: Skakel tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare the pinned tag with the newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pinned=$(sed -n 's/^skakel-server = .*tag = "\(v[0-9.]*\)".*/\1/p' src/Cargo.toml)
          latest=$(git ls-remote --tags --refs https://github.com/matumi-software/skakel 'v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "Pinned $pinned, newest $latest."
          if [ "$pinned" = "$latest" ]; then exit 0; fi
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)
          [ "$newest" = "$latest" ] || exit 0
          title="Skakel $latest is out (Koppel pins $pinned)"
          echo "::warning::$title"
          echo "$title" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Skakel" "is out"' --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The weekly Advisories workflow found a newer Skakel tag. Read its changelog, then move the four \`skakel-*\` tags in \`src/Cargo.toml\` and update \`docs/skakel.md\`."
          fi
