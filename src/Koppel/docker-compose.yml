# Run from this folder (src/Koppel):
#   docker compose up --build
# Then browse http://localhost:5240/

name: koppel

services:
  koppel:
    image: ${DOCKER_REGISTRY-}matumi/koppel
    build:
      context: ..
      dockerfile: Koppel/src/Koppel/Dockerfile
    ports:
      - "5240:5240"
      - "5241:5241"
    volumes:
      - koppel:/koppel
    restart: unless-stopped
    # To encrypt the key ring at rest, mount a PFX as a secret and point Koppel at it:
    # environment:
    #   - Paths__KeyCertificate=/run/secrets/koppel_keys
    # secrets:
    #   - koppel_keys

volumes:
  koppel:
