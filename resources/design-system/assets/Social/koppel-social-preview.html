<!doctype html>
<!-- Koppel social preview, 1280x640. Open in a browser and screenshot the .card element at 1280x640. -->
<html lang="en"><head><meta charset="utf-8"><title>Koppel social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page:#161512; --text-primary:#EDEAE0; --text-secondary:#B5B0A2; --text-tertiary:#8A8578;
  --accent:#549572; --accent-subtle:#1D2B23; --attached:#5FA0A6; --attached-subtle:#1B2829; --border-default:#34322B;
}
html, body { margin:0; background:var(--bg-page); }
.card { position:relative; width:1280px; height:640px; overflow:hidden; background:var(--bg-page); font-family:'Instrument Sans', sans-serif; }
.art { position:absolute; inset:0; }
.canopy { fill:var(--accent); } .river { fill:var(--attached); } .ink { fill:var(--text-primary); }
.tint { fill:var(--accent-subtle); } .rtint { fill:var(--attached-subtle); }
.cut { fill:var(--bg-page); } .cutline { stroke:var(--bg-page); }
.text { position:absolute; left:80px; top:80px; bottom:80px; width:560px; display:flex; flex-direction:column; }
.mark { width:96px; height:96px; }
h1 { margin:auto 0 0; font:600 156px/0.9 'Instrument Sans', sans-serif; letter-spacing:-0.025em; color:var(--text-primary); }
h1 .hi { color:var(--accent); }
p { margin:28px 0 0; font-size:32px; line-height:42px; color:var(--text-secondary); max-width:540px; }
.foot { margin-top:36px; display:flex; gap:16px; align-items:center; font:400 21px/1 'JetBrains Mono', monospace; color:var(--text-tertiary); white-space:nowrap; }
.foot b { font-weight:500; color:var(--text-secondary); }
.dot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--border-default); }
</style></head><body>
<div class="card">

    <rect class="river" x="992" y="160" width="320" height="216" rx="16"/>
    <clipPath id="blk"><rect x="992" y="160" width="320" height="216" rx="16"/></clipPath><g class="cut" clip-path="url(#blk)"><circle cx="1016" cy="212" r="8"/><rect x="1044" y="204" width="16" height="16" rx="3"/><circle cx="1088" cy="212" r="8"/><rect x="1116" y="204" width="16" height="16" rx="3"/><circle cx="1160" cy="212" r="8"/><rect x="1188" y="204" width="16" height="16" rx="3"/><circle cx="1232" cy="212" r="8"/><rect x="1260" y="204" width="16" height="16" rx="3"/><circle cx="1304" cy="212" r="8"/><rect x="1026" y="234" width="16" height="16" rx="3"/><circle cx="1070" cy="242" r="8"/><rect x="1098" y="234" width="16" height="16" rx="3"/><circle cx="1142" cy="242" r="8"/><rect x="1170" y="234" width="16" height="16" rx="3"/><circle cx="1214" cy="242" r="8"/><rect x="1242" y="234" width="16" height="16" rx="3"/><circle cx="1286" cy="242" r="8"/><rect x="1314" y="234" width="16" height="16" rx="3"/><circle cx="1016" cy="272" r="8"/><rect x="1044" y="264" width="16" height="16" rx="3"/><circle cx="1088" cy="272" r="8"/><rect x="1116" y="264" width="16" height="16" rx="3"/><circle cx="1160" cy="272" r="8"/><rect x="1188" y="264" width="16" height="16" rx="3"/><circle cx="1232" cy="272" r="8"/><rect x="1260" y="264" width="16" height="16" rx="3"/><circle cx="1304" cy="272" r="8"/><rect x="1026" y="294" width="16" height="16" rx="3"/><circle cx="1070" cy="302" r="8"/><rect x="1098" y="294" width="16" height="16" rx="3"/><circle cx="1142" cy="302" r="8"/><rect x="1170" y="294" width="16" height="16" rx="3"/><circle cx="1214" cy="302" r="8"/><rect x="1242" y="294" width="16" height="16" rx="3"/><circle cx="1286" cy="302" r="8"/><rect x="1314" y="294" width="16" height="16" rx="3"/><circle cx="1016" cy="332" r="8"/><rect x="1044" y="324" width="16" height="16" rx="3"/><circle cx="1088" cy="332" r="8"/><rect x="1116" y="324" width="16" height="16" rx="3"/><circle cx="1160" cy="332" r="8"/><rect x="1188" y="324" width="16" height="16" rx="3"/><circle cx="1232" cy="332
