[package]
name = "koppel-usb"
description = "Koppel's USB layer: USB/IP, the Linux kernel's usbip-host and vhci-hcd, usbip-win2, usbipd-win, and the server and client roles over a stream to the other machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
koppel-config.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-util.workspace = true
tracing.workspace = true
serde.workspace = true
ts-rs.workspace = true
time.workspace = true
thiserror.workspace = true
http.workspace = true

[features]
# Test doubles other crates use: in-memory streams.
test-util = []

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# The tests of this crate use the test doubles too.
koppel-usb = { path = ".", features = ["test-util"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
proptest-state-machine = "0.9.0"
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
