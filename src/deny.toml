# cargo-deny's policy for the Rust workspace: licences, advisories and where crates come from.
# `cargo deny check` runs from src/ in the CI workflow. The licence list matches
# installer/notices/about.toml, which the installer builds use for the notices, so the two agree.
# Koppel's own crates are GPL-3.0-or-later (see CLAUDE.md for what may come in).

[graph]
# Every target Koppel ships: Windows, and the three Linux musl targets of the image and the .deb files.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "arm-unknown-linux-musleabihf",
]

[licenses]
# about.toml lists a few licences no crate uses today; keep them allowed so the two files stay the same.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # MPL-2.0, reached only through rust-embed's proc-macro (rust-embed-impl, shellexpand, dirs), which
    # runs at build time: none of its code is in the programs. Same reason as in about.toml.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[advisories]
# A crate with a known advisory fails the check. An ignore needs the advisory id and the reason.
ignore = []

[bans]
multiple-versions = "allow"
# The Skakel crates come from git at a tag and carry no version, which cargo-deny reads as a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Skakel is not on crates.io; Koppel takes it from its repository at the release tag.
allow-git = ["https://github.com/matumi-software/skakel"]
