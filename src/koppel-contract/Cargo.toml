[package]
name = "koppel-contract"
description = "Contract tests that drive a running Koppel over HTTPS, so the Rust build is checked against 0.1.x"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Tests only: the library is the harness the tests in tests/ share. It talks HTTP to a target and
# never links Koppel's own crates, so it checks what a browser or another machine sees.
[dependencies]
tokio = { workspace = true }
reqwest.workspace = true
rustls.workspace = true
ring.workspace = true
serde_json.workspace = true
