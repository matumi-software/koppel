[package]
name = "koppel"
description = "USB devices shared over the network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
koppel-config.workspace = true
koppel-web.workspace = true
koppel-usb.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-service.workspace = true
# `koppel healthcheck`'s HTTPS client: rustls with ring, on what the server already carries. No new crates.
rustls.workspace = true
tokio-rustls.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The contract tests in tests/contract (never shipped): they start the program and talk HTTPS to it.
# reqwest is the client, on the rustls above with the certificate check the tests pin themselves.
# ring takes the SHA-256 of a pinned certificate, and serde_json reads the answers.
reqwest.workspace = true
ring.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
koppel-windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
