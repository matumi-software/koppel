# The licence policy for the Rust crates Koppel ships, read by cargo-about in new-notices.ps1 -Rust
# (the Windows installer) and in src/koppel-bin/Dockerfile (the .deb files and the image). A crate
# under a licence not named here stops the build, so a new one is looked at, not shipped unseen.
# Koppel's own crates are GPL-3.0-or-later. The targets are not set here: each build passes its own
# with --target (x86_64-pc-windows-msvc, or the three Linux musl targets).
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# MPL-2.0, reached only through rust-embed's proc-macro (rust-embed-impl, shellexpand, dirs), which
# runs at build time: none of its code is in the programs. Listed rather than hidden.
[option-ext]
accepted = ["MPL-2.0"]
