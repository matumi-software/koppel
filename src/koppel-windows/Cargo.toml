[package]
name = "koppel-windows"
description = "Koppel's Windows app: the service, the tray icon, the Start menu entry and the event log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# KoppelDesktop.exe in the install folder: the tray icon the service starts in each signed-in session
# and the Start menu entry. A Windows program, so neither opens a console window.
[[bin]]
name = "koppel-desktop"
path = "src/main.rs"

# What `wire` needs builds everywhere, so its tests run on Linux.
[dependencies]
koppel-app.workspace = true
serde.workspace = true
serde_json.workspace = true

# The rest is Windows only. Elsewhere the library holds only `wire` and the program does nothing.
[target.'cfg(windows)'.dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
url.workspace = true
windows-service.workspace = true
winreg.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry", # only for ShellExecuteExW, which the bindings gate behind it
    "Win32_System_RemoteDesktop",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
