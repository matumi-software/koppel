# Koppel's Cargo workspace. The program is the `koppel` package, in `koppel/`.
[workspace]
resolver = "3"
members = [
    "koppel",
    "koppel-app",
    "koppel-config",
    "koppel-secrets",
    "koppel-upgrade",
    "koppel-usb",
    "koppel-web",
    "koppel-windows",
    "usbip",
]
# What a plain `cargo build` and `cargo test` take: everything except the Windows app, which builds
# to an empty library and a program that does nothing on Linux. `--workspace` and `-p koppel-windows`
# still build it, as the Windows installer script and the checks in CLAUDE.md do, and `koppel` pulls
# its library in on Windows.
default-members = [
    "koppel",
    "koppel-app",
    "koppel-config",
    "koppel-secrets",
    "koppel-upgrade",
    "koppel-usb",
    "koppel-web",
    "usbip",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
authors = ["Matumi Software"]
license = "GPL-3.0-or-later"
repository = "https://github.com/matumi-software/koppel"

[workspace.lints.rust]
# For the crates that need no unsafe code: koppel. It takes this with
# `[lints] workspace = true`. The crates that call the operating system (koppel-config, koppel-usb,
# koppel-web, koppel-windows) have unsafe blocks and stay out until each one is narrowed to one module.
unsafe_code = "forbid"

[workspace.dependencies]
koppel-web = { path = "koppel-web", version = "0.2.1" }
koppel-app = { path = "koppel-app", version = "0.2.1" }
koppel-config = { path = "koppel-config", version = "0.2.1" }
koppel-secrets = { path = "koppel-secrets", version = "0.2.1" }
koppel-upgrade = { path = "koppel-upgrade", version = "0.2.1" }
koppel-usb = { path = "koppel-usb", version = "0.2.1" }
koppel-windows = { path = "koppel-windows", version = "0.2.1" }
usbip = { path = "usbip", version = "0.2.1" }

# The async runtime (MIT).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# The tokio project's helpers (MIT), already here through h2. The USB layer takes its
# CancellationToken, which cancels a whole tree of tasks (an attach, its relay, a link's epoch).
tokio-util = { version = "0.7.20", features = ["rt"] }

# `Bytes`, which is what Skakel's streams carry in their data frames: koppel-web passes the frames
# through without copying them. Already in the build through tonic and Skakel, MIT.
bytes = "1.12.1"

# The web stack. Every crate here, and what it pulls in, is MIT, Apache-2.0, BSD, ISC or Unicode-3.0
# (checked with `cargo metadata`). rustls runs on ring rather than aws-lc-rs, which needs a C toolchain
# with NASM on Windows, as in Skakel.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
http-body-util = "0.1.5"
# The HTTP types (MIT OR Apache-2.0), already here through axum and hyper. koppel-usb reads a URL's
# authority with its `Uri`.
http = "1.5.0"
tower-service = "0.3.3"
# URL parsing (MIT OR Apache-2.0), already here through Skakel's client. koppel-windows reads the UI's
# address with it.
url = "2.5.8"
# tower (MIT, already in the tree through axum): its `ServiceExt::oneshot` drives the router in the guard tests, one
# request at a time with the extensions the accept loop would add.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# The guards' layers (koppel-web), tower-http (MIT, Tower project, already in the tree through tonic):
# the security headers on every answer, a panic caught as a 500, a timeout on the UI's handlers and a
# trace of each request at debug level.
tower-http = { version = "0.6.11", default-features = false, features = ["set-header", "catch-panic", "timeout", "trace"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The server certificate Koppel makes on its first start, and the next one for a handover.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }

# The built UI inside the program (MIT). `interpolate-folder-path` lets it embed the gzipped copy the
# build script writes to OUT_DIR.
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
# Gzip (MIT OR Apache-2.0), on miniz_oxide (MIT OR Zlib OR Apache-2.0), so no C code. The build script
# compresses with it, and the server inflates for the rare client that does not take gzip.
flate2 = "1.1.11"

# The UI's server side (koppel-web), pinned as in Skakel. futures-util (MIT OR Apache-2.0, already in
# the tree through axum and hyper) builds the Server-Sent Events stream. socket2 (MIT OR Apache-2.0,
# already here through tokio) binds the any-address listener as one dual-stack socket, as Kestrel's
# ListenAnyIP does; Windows makes an IPv6 socket IPv6 only unless told otherwise. if-addrs (MIT OR
# BSD-3-Clause, on libc and windows-sys, both already here) lists this machine's networks for
# `Ui:AllowFrom=lan`; Skakel's discovery uses it too.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
socket2 = "0.6.5"
if-addrs = "0.15.0"

# The command line and the settings (koppel): clap (MIT OR Apache-2.0) with derive and env. Without
# its default features, so no colour, suggestions or wrapping crates beyond what `help` and `usage`
# need.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }

# Logging (MIT). The subscriber goes without `env-filter`, which pulls in a regex engine: the
# `Targets` filter reads the usual RUST_LOG form of `level` and `target=level` without one.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
# tracing-appender (MIT, tokio project) gives the Windows service's log file its non-blocking worker thread; the
# size-capped rotation is koppel-windows' own, since its rolling appender rotates by time only.
tracing-appender = { version = "0.2.5", default-features = false }

# The contract tests only (`koppel/tests/contract`, never shipped). The HTTP client is reqwest (MIT OR
# Apache-2.0), as in Skakel, on the rustls and ring above with a certificate check the tests set up
# themselves, so there is no second TLS stack. JSON is serde_json (MIT OR Apache-2.0). ring (Apache-2.0
# AND ISC) is already in the tree through rustls; it is named for the SHA-256 of a pinned certificate.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }

# Config files and secrets (koppel-config). serde, serde_json, base64 and time are MIT OR Apache-2.0
# and pinned as in Skakel; serde_json pulls in zmij (MIT). ring (Apache-2.0 AND ISC) is already here
# through rustls: AES-256-GCM, HMAC, SHA and random bytes come from it. serde_json and ring serve the
# contract tests too.
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps the names of a JSON object in the order they were written.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
base64 = "0.23.1"
# The session cookie's header, written and read (MIT OR Apache-2.0, on the `time` already here). No default
# features: no percent-encoding, no signing, no jar.
cookie = { version = "0.18.1", default-features = false }
# Dates are RFC 3339 strings (`time::serde::rfc3339`), in the files and in the API.
time = { version = "0.3.55", features = ["serde-well-known"] }
# An ordered map for the files that keep one (devices.json, ui-auth.json): MIT OR Apache-2.0, already
# here through h2 and serde_json's `preserve_order`.
indexmap = { version = "2.14.2", features = ["serde"] }
ring = "0.17.14"
# TypeScript types for the wire, generated from the Rust types the API sends and reads (MIT). No
# default features: no export to disk from the derive, koppel-web's `wire` test writes the one file.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
# Wiping a secret when it is dropped (koppel-config's `Secret`). zeroize (MIT OR Apache-2.0, RustCrypto) is already here
# through the crypto crates.
zeroize = "1.9.1"
# What ring lacks for reading 0.1.x's files, in koppel-upgrade only: AES-256-CBC for Data Protection
# payloads and 3DES-CBC for .NET's PKCS#12 export. RustCrypto, MIT OR Apache-2.0.
aes = "0.9.4"
cbc = "0.2.1"
des = "0.9.0"
# Data Protection's key ring is XML (MIT OR Apache-2.0, no dependencies); koppel-upgrade reads it.
roxmltree = "0.21.2"
# Microsoft's Windows bindings (MIT OR Apache-2.0), as Skakel pins them: DPAPI, ACLs, the
# ProgramData folder, the TCP table the USB gateway checks a connection's owner in, and the Windows
# version for the side panel.
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Telling systemd that Koppel is ready, stopping and still healthy (koppel, Linux only): sd-notify
# (MIT OR Apache-2.0), pure Rust on libc, which is already here.
sd-notify = "0.5.0"

# The Windows app (koppel-windows). windows-service (MIT OR Apache-2.0, Mullvad) runs the service
# and talks to the service manager; it brings widestring (MIT OR Apache-2.0) and windows-sys and
# bitflags, which are already here. winresource (MIT) is a build dependency: it runs the Windows SDK's
# resource compiler for the icon, the version, the manifest and the event log's message table, as in
# Tweeling.
windows-service = "0.8.1"
# winreg (MIT) reads and writes the registry value that publishes the UI's address, in place of the
# raw Registry calls and their unsafe blocks. It sits on windows-sys, already here.
winreg = "0.56.0"
winresource = "0.1.34"

# The USB layer (koppel-usb). libc (MIT OR Apache-2.0), already here through tokio, for the one
# ioctl sysfs cannot do: resetting a USB device through its usbfs node on Linux. koppel-config takes
# it too, for `geteuid`, to check who owns the config and keys directories.
libc = "0.2.191"
# Typed errors for koppel-usb (MIT OR Apache-2.0), already here through the Skakel crates and
# tonic. The Display of each variant is the sentence the UI shows; the source stays for the log.
thiserror = "2.0.21"

# The transport between Koppel machines: Skakel 0.3.0 (MIT), protocol version 3 over gRPC, from its
# repository at the release tag; Skakel is not on crates.io. What they pull in is MIT, Apache-2.0, BSD, ISC,
# Zlib, Unlicense or Unicode-3.0, as Skakel's docs/parts.md says.
skakel-server = { git = "https://github.com/matumi-software/skakel", tag = "v0.3.0" }
skakel-client = { git = "https://github.com/matumi-software/skakel", tag = "v0.3.0" }
skakel-wire = { git = "https://github.com/matumi-software/skakel", tag = "v0.3.0" }
# Koppel's own gRPC service, the remote device list, from its .proto file, as Skakel builds its own:
# prost (Apache-2.0) for the messages, tonic (MIT) for the service, protox (MIT OR Apache-2.0) to
# compile the .proto file in Rust so no protoc is needed. All are in the tree through Skakel, at the
# versions it pins.
prost = "0.14.4"
tonic = { version = "0.14.9", default-features = false }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
protox = "0.10.0"

# PBKDF2 with 600,000 rounds takes seconds in an unoptimized ring, which makes every debug build's
# sign-in, and the tests that sign in, crawl. Only ring is optimized; the rest stays debuggable.
[profile.dev.package.ring]
opt-level = 3

# The shipped programs, tuned for size because a Raspberry Pi Zero runs them (#92). One codegen unit and
# fat LTO let the optimizer see the whole program and drop what it never calls; `z` optimizes the rest for
# size; strip drops the symbol table. Measured on Windows: Koppel.exe 17.4 MB with the defaults, 14.3 MB at
# opt-level 3 with the same LTO, 8.5 MB like this. Unwinding stays (no `panic = "abort"`): a panicking
# config change handler, background task or listener is caught as a failed tokio task and logged, and the
# rest keeps running, which koppel-config and koppel-usb rely on.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# ring at full speed even in a release build for size: at `z` the 600,000-round PBKDF2 of a sign-in took
# 1.8 times as long on an emulated Pi Zero CPU, and TLS was slower too. At 3 both match an opt-level 3
# build, for 60 KB.
[profile.release.package.ring]
opt-level = 3
