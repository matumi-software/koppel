[package]
name = "koppel-web"
description = "Koppel's web server: HTTPS with a certificate that can change while it runs, the UI, its sign-in, REST API and live push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
koppel-config.workspace = true
indexmap.workspace = true
koppel-usb.workspace = true
skakel-server.workspace = true
skakel-client.workspace = true
skakel-wire.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tower-service.workspace = true
tower-http.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rcgen.workspace = true
rust-embed.workspace = true
flate2.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
ring.workspace = true
base64.workspace = true
futures-util.workspace = true
socket2.workspace = true
if-addrs.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[build-dependencies]
flate2.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# The guard tests call the router with `ServiceExt::oneshot`.
tower.workspace = true
# The role tests drive two Koppels over HTTPS as the UI does.
reqwest.workspace = true
# The role tests put a fake kernel behind koppel-usb's host and attacher traits.
koppel-usb = { workspace = true, features = ["test-util"] }
