# Weekly updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/ui
    schedule:
      interval: weekly
    groups:
      pnpm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
