# Runs Koppel from Docker Hub, or the image deploy.sh copied here. No build here.
#   docker compose up -d
# Then browse https://<this machine>:5240/
#
# The image tag is pinned. To upgrade, change it to the new version and run
# `docker compose pull && docker compose up -d`. Config and keys live in the koppel volume, not the
# image, so an upgrade keeps them. (deploy.sh sets this tag itself when it copies an image over.)

name: koppel

services:
  koppel:
    image: matumisoftware/koppel:0.2.0
    # An image already here (one deploy.sh copied, or one you built) is used as it is and is never
    # replaced by a pull from Docker Hub. Only a missing image is pulled.
    pull_policy: missing
    # The host's network: clients find the server by broadcasting on the local network, which does not
    # cross Docker's bridge. Koppel listens on the host's ports directly (5240, TCP for the UI
    # and everything other machines do, UDP for discovery) and takes the host's name, which it shows and puts in its certificate.
    network_mode: host
    volumes:
      - koppel:/koppel
    # Binding devices to usbip-host and attaching through vhci-hcd writes to /sys, which needs root
    # in a privileged container. Attached devices appear on this machine's kernel.
    user: "0"
    privileged: true
    # Always, not unless-stopped: Koppel comes back after a crash and after the machine restarts.
    restart: always
    # Docker's default json-file log has no size limit, so a busy or looping Koppel fills the disk. 30 MB at most.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: keep the key that seals Koppel's secret files outside the koppel volume, so a backup or a
    # copy of the volume does not carry it. Without it the key sits in the volume, in the keys folder.
    # Make a key file next to this one, mode 0600:
    #   openssl rand -base64 32 > koppel-key
    #   chmod 600 koppel-key
    # then uncomment `secrets:` here and the `secrets:` block at the bottom. Docker mounts the secret at
    # /run/secrets/koppel-key and Koppel reads it from there (see "Keeping the key outside the volume" in
    # docs/security.md). Back the key file up apart from the volume: without it the secret files cannot be read.
    # secrets:
    #   - koppel-key

volumes:
  koppel:

# secrets:
